<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal OCR - Công cụ hỗ trợ đắc lực</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <nav class="bg-blue-600 p-4 text-white shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">LEGAL OCR 2026</h1>
            <div id="auth-status"></div>
        </div>
    </nav>

    <main class="container mx-auto p-6">
        <div class="bg-white rounded-xl shadow-md p-8 max-w-2xl mx-auto">
            <h2 class="text-2xl font-semibold mb-4 text-gray-800">Tải tài liệu lên</h2>
            
            <div class="border-2 border-dashed border-gray-300 rounded-lg p-10 text-center" id="drop-zone">
                <input type="file" id="file-input" class="hidden" accept="image/*">
                <button onclick="document.getElementById('file-input').click()" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-full transition">
                    Chọn ảnh tài liệu
                </button>
                <p class="mt-2 text-gray-500 text-sm">Hỗ trợ định dạng: JPG, PNG, PDF (Ảnh)</p>
            </div>

            <div id="loading" class="hidden mt-4 text-center text-blue-600 font-medium">
                🚀 Đang xử lý OCR và sửa lỗi tiếng Việt...
            </div>

            <div id="result-area" class="hidden mt-6">
                <h3 class="font-bold text-gray-700 mb-2">Kết quả sau khi chỉnh sửa:</h3>
                <textarea id="output-text" class="w-full h-48 p-4 border rounded-lg bg-gray-50" readonly></textarea>
                <button onclick="copyText()" class="mt-2 text-blue-600 hover:underline text-sm">Sao chép văn bản</button>
            </div>
        </div>
    </main>

    <script>
        const HF_API_URL = "https://huggingface.co/spaces/SKDTeam/legalocr";

        async function handleUpload(file) {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('result-area').classList.add('hidden');

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(sb_publishable_pBOiwmECbp7mZSWBj9OfQw_lpymItu3, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                document.getElementById('output-text').value = data.corrected;
                document.getElementById('result-area').classList.remove('hidden');
            } catch (error) {
                alert("Lỗi kết nối đến Backend!");
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        document.getElementById('file-input').onchange = (e) => handleUpload(e.target.files[0]);
    </script>
</body>
</html>
