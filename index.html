<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal OCR - Hệ thống OCR Pháp lý</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-blue-800 p-4 text-white shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Legal OCR AI</h1>
            <div id="auth-section">
                <button id="login-btn" class="bg-white text-blue-800 px-4 py-2 rounded">Đăng nhập Google</button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-6 max-w-2xl">
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl font-semibold mb-4">Tải tài liệu OCR</h2>
            <input type="file" id="file-input" class="w-full p-2 border rounded mb-4" accept="image/*">
            <button id="process-btn" class="w-full bg-blue-600 text-white py-3 rounded font-bold hover:bg-blue-700">
                Xử lý tài liệu
            </button>
            
            <div id="loading" class="hidden mt-4 text-center text-blue-600">Đang OCR và sửa lỗi chính tả...</div>
            
            <div id="result-area" class="hidden mt-6">
                <label class="block font-bold mb-2">Nội dung đã xử lý:</label>
                <textarea id="output-text" class="w-full h-64 p-4 border rounded bg-gray-50"></textarea>
            </div>
        </div>
    </main>

    <script>
    // Chỉ giữ lại DUY NHẤT một đoạn này trong file
    const SUPABASE_URL = "https://pvdwqtsvulgybvzljvau.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2ZHdxdHN2dWxneWJ2emxqdmF1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2Mzk1NDAsImV4cCI6MjA5NDIxNTU0MH0.kuPIxqUzRuyTOKqhFM80eEsF32rJ4vT8IiffGUoxza8";
    const HF_API_URL = "https://huggingface.co/spaces/SKDTeam/legalocr";

    // Khởi tạo Supabase chỉ một lần duy nhất
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Đăng nhập Google
    document.getElementById('login-btn').onclick = async () => {
        await supabase.auth.signInWithOAuth({ provider: 'google' });
    };

    // Xử lý OCR
    document.getElementById('process-btn').onclick = async () => {
        const fileInput = document.getElementById('file-input');
        if (fileInput.files.length === 0) return alert("Vui lòng chọn ảnh!");

        const { data: { user } } = await supabase.auth.getUser();
        if (!user) return alert("Vui lòng đăng nhập trước!");

        document.getElementById('loading').classList.remove('hidden');
        
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        try {
            const res = await fetch(HF_API_URL, { method: 'POST', body: formData });
            const data = await res.json();
            
            if (data.corrected) {
                document.getElementById('output-text').value = data.corrected;
                document.getElementById('result-area').classList.remove('hidden');

                // Lưu vào Supabase
                await supabase.from('ocr_history').insert([
                    { user_id: user.id, result_text: data.corrected, image_url: 'uploaded' }
                ]);
            } else {
                alert("Lỗi từ server AI: " + JSON.stringify(data));
            }
        } catch (err) {
            alert("Lỗi kết nối: " + err);
        } finally {
            document.getElementById('loading').classList.add('hidden');
        }
    };
</script>
</body>
</html>
